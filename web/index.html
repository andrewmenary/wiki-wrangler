<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiki Wrangler</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #66727c;
      --paper: #f5f1e9;
      --panel: #fffdf8;
      --accent: #bc4b35;
      --accent-dark: #8f3527;
      --line: #ded6c9;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 12% 8%, #e8c7a5 0, transparent 28%), var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 440px);
      gap: clamp(2rem, 8vw, 8rem);
      align-items: center;
      max-width: 1180px;
      min-height: 100vh;
      margin: auto;
      padding: 3rem clamp(1.25rem, 5vw, 5rem);
    }
    .intro { max-width: 560px; }
    .eyebrow {
      margin: 0 0 1.5rem;
      color: var(--accent-dark);
      font: 700 .78rem/1.2 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.3rem, 8vw, 6.4rem);
      line-height: .88;
      letter-spacing: -.04em;
    }
    .intro p {
      max-width: 430px;
      margin: 2rem 0 0;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1.55;
    }
    .panel {
      padding: clamp(1.5rem, 4vw, 2.6rem);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 12px 16px 0 rgba(23, 33, 43, .08);
    }
    h2 { margin: 0 0 .45rem; font-size: 2rem; }
    .subcopy { margin: 0 0 1.8rem; color: var(--muted); line-height: 1.45; }
    form { display: grid; gap: 1rem; }
    label { display: grid; gap: .4rem; font: 700 .78rem/1.2 Arial, sans-serif; text-transform: uppercase; }
    input {
      width: 100%;
      padding: .8rem .85rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: #fff;
      font: 1rem Georgia, "Times New Roman", serif;
    }
    input:focus { outline: 2px solid #e3a58a; border-color: var(--accent); }
    button {
      padding: .85rem 1rem;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      font: 700 .9rem Arial, sans-serif;
    }
    button:hover { background: var(--accent-dark); }
    .switch {
      margin: 1.2rem 0 0;
      color: var(--muted);
      font: .88rem Arial, sans-serif;
      text-align: center;
    }
    .switch button { padding: 0; color: var(--accent-dark); background: transparent; text-decoration: underline; }
    .message { min-height: 1.25rem; margin: 1rem 0 0; color: var(--accent-dark); font: .9rem Arial, sans-serif; }
    .workspace-head { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
    .workspace-head h2 { margin-bottom: .2rem; }
    .workspace-head p { margin: 0; color: var(--muted); font: .85rem Arial, sans-serif; }
    .quiet-button { padding: .2rem 0; color: var(--accent-dark); background: transparent; font-size: .75rem; }
    .quiet-button:hover { background: transparent; text-decoration: underline; }
    .capture-form { display: grid; gap: .65rem; margin: 1.7rem 0; }
    .capture-form input { font-size: .95rem; }
    .capture-form button { width: 100%; }
    .inbox { display: grid; gap: .65rem; margin-top: 1.5rem; }
    .inbox-label { color: var(--muted); font: 700 .72rem Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .item { padding: .9rem; border-top: 1px solid var(--line); }
    .item h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
    .item p { margin: 0; color: var(--muted); font: .78rem Arial, sans-serif; }
    .item button { width: 100%; padding: 0; color: var(--ink); background: transparent; text-align: left; }
    .item button:hover { background: transparent; }
    .review { margin-top: 1.8rem; padding-top: 1.3rem; border-top: 1px solid var(--line); }
    .review h3 { margin: 0 0 1rem; font-size: 1.35rem; }
    .review-meta { display: grid; gap: .8rem; margin-bottom: 1rem; }
    .review-source { margin: 0 0 1rem; color: var(--muted); font: .78rem Arial, sans-serif; }
    .generated-preview { margin: 0 0 1rem; padding: .8rem; max-height: 220px; overflow: auto; border: 1px solid var(--line); background: #f7f2eb; white-space: pre-wrap; font: .82rem/1.5 Consolas, monospace; }
    .markdown-toolbar { display: flex; gap: .35rem; margin-bottom: .5rem; }
    .markdown-toolbar button { padding: .45rem .7rem; font-size: .75rem; }
    .markdown-toolbar button[aria-pressed="true"] { color: #fff; background: var(--accent-dark); }
    .markdown-preview { min-height: 260px; padding: 1rem; border: 1px solid var(--line); background: #fff; line-height: 1.6; }
    .markdown-preview h1, .markdown-preview h2, .markdown-preview h3 { margin: 0 0 .7rem; line-height: 1.15; }
    .markdown-preview p { margin: 0 0 .85rem; }
    .markdown-preview code { padding: .1rem .25rem; background: #f0ebe3; font: .85em Consolas, monospace; }
    .category-settings { margin-top: 1.8rem; padding-top: 1.3rem; border-top: 1px solid var(--line); }
    .category-settings summary { cursor: pointer; color: var(--accent-dark); font: 700 .78rem Arial, sans-serif; text-transform: uppercase; }
    .category-form { display: grid; gap: .65rem; margin-top: 1rem; }
    .category-form button { width: 100%; }
    .category-list { display: grid; gap: .4rem; margin-top: 1rem; }
    .category-row { display: flex; justify-content: space-between; gap: .8rem; align-items: center; font: .8rem Arial, sans-serif; }
    .category-label { display: grid; gap: .15rem; min-width: 0; }
    .category-label strong, .category-label small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .category-label small { color: var(--muted); font: .72rem Arial, sans-serif; }
    .category-actions { display: flex; flex-shrink: 0; gap: .2rem; }
    .category-row button { padding: .2rem .4rem; color: var(--accent-dark); background: transparent; font-size: .72rem; }
    .category-row button:hover { background: transparent; text-decoration: underline; }
    .review textarea { width: 100%; min-height: 180px; resize: vertical; }
    .review-actions { display: flex; gap: .6rem; margin-top: .8rem; }
    .review-actions button { flex: 1; }
    .secondary-button { color: var(--ink); background: #ebe3d7; }
    .secondary-button:hover { background: #dfd4c5; }
    .empty { color: var(--muted); font: .9rem Arial, sans-serif; }
    body.workspace-mode { background: var(--paper); }
    body.workspace-mode main {
      display: block;
      max-width: 1440px;
      padding: 2rem clamp(1rem, 4vw, 4rem);
    }
    body.workspace-mode .intro { display: none; }
    body.workspace-mode .panel {
      width: 100%;
      max-width: none;
      min-height: calc(100vh - 4rem);
      padding: clamp(1.5rem, 3vw, 3rem);
      box-shadow: 0 10px 30px rgba(23, 33, 43, .08);
    }
    body.workspace-mode .review { max-width: 1040px; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; align-content: center; gap: 2.5rem; }
      .intro p { margin-top: 1.2rem; }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">A quieter way to keep knowledge</p>
      <h1 id="page-title">Wiki<br>Wrangler</h1>
      <p>Capture the useful fragments, shape them into durable notes, and keep your team wiki worth returning to.</p>
    </section>
    <section class="panel" aria-live="polite">
      <div id="auth-view">
        <h2 id="form-title">Welcome back</h2>
        <p class="subcopy" id="form-copy">Sign in to continue to your inbox.</p>
        <form id="auth-form">
          <label id="name-field" hidden>
            Display name
            <input id="display-name" name="display_name" autocomplete="name">
          </label>
          <label>
            Email
            <input id="email" name="email" type="email" autocomplete="email" required>
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" minlength="8" autocomplete="current-password" required>
          </label>
          <button id="submit-button" type="submit">Sign in</button>
        </form>
        <p class="message" id="message" role="status"></p>
        <p class="switch"><span id="switch-copy">New here?</span> <button id="switch-button" type="button">Create an account</button></p>
      </div>
      <div id="app-view" hidden>
        <div class="workspace-head">
          <div>
            <h2>Inbox</h2>
            <p id="user-greeting"></p>
          </div>
          <button class="quiet-button" id="logout-button" type="button">Sign out</button>
        </div>
        <form class="capture-form" id="url-form">
          <label>
            Capture a web page
            <input id="url-input" type="url" placeholder="https://example.com/article" required>
          </label>
          <button type="submit">Add to inbox</button>
        </form>
        <form class="capture-form" id="upload-form">
          <label>
            Upload a Markdown or text file
            <input id="file-input" type="file" accept=".md,.txt" required>
          </label>
          <label>
            Capture title
            <input id="file-title" type="text" placeholder="Optional title">
          </label>
          <button type="submit">Upload and convert</button>
        </form>
        <p class="message" id="capture-message" role="status"></p>
        <div class="inbox">
          <div class="inbox-label">Recent captures</div>
          <div id="item-list"><p class="empty">No captures yet.</p></div>
        </div>
        <div class="review" id="review-view" hidden>
          <h3 id="review-title"></h3>
          <p class="review-source" id="review-source"></p>
          <div class="review-meta">
            <label>
              Title
              <input id="review-item-title" type="text">
            </label>
            <label>
              Summary
              <input id="review-summary" type="text">
            </label>
            <label>
              Tags
              <input id="review-tags" type="text" placeholder="process, onboarding, notes">
            </label>
            <label>
              Category
              <select id="review-category">
                <option value="">Uncategorized</option>
              </select>
            </label>
          </div>
          <label>
            Generated Markdown preview
            <pre class="generated-preview" id="review-generated"></pre>
          </label>
          <div class="markdown-toolbar" role="group" aria-label="Markdown draft mode">
            <button class="secondary-button" id="markdown-source-mode" type="button" aria-pressed="true">Source</button>
            <button class="secondary-button" id="markdown-preview-mode" type="button" aria-pressed="false">Preview</button>
          </div>
          <div id="markdown-source-panel">
            <label>
              Markdown draft
              <textarea id="review-markdown"></textarea>
            </label>
          </div>
          <div id="markdown-preview-panel" hidden>
            <div class="markdown-preview" id="review-markdown-preview" aria-label="Rendered Markdown preview"></div>
          </div>
          <p class="message" id="review-message" role="status"></p>
          <div class="review-actions">
            <button class="secondary-button" id="review-save" type="button">Save changes</button>
            <button class="secondary-button" id="review-archive" type="button">Archive</button>
            <button id="review-approve" type="button">Approve</button>
          </div>
        </div>
        <details class="category-settings">
          <summary>Manage categories</summary>
          <form class="category-form" id="category-form">
            <label>
              Name
              <input id="category-name" type="text" required>
            </label>
            <label>
              Path segment
              <input id="category-path" type="text" placeholder="wiki-wrangler" required>
            </label>
            <label>
              Parent
              <select id="category-parent">
                <option value="">No parent</option>
              </select>
            </label>
            <button type="submit">Create category</button>
          </form>
          <div class="category-list" id="category-list"></div>
          <p class="message" id="category-message" role="status"></p>
        </details>
      </div>
    </section>
  </main>
  <script type="module">
    import DOMPurify from "dompurify";
    import { marked } from "marked";

    const form = document.querySelector("#auth-form");
    const authView = document.querySelector("#auth-view");
    const appView = document.querySelector("#app-view");
    const nameField = document.querySelector("#name-field");
    const displayName = document.querySelector("#display-name");
    const formTitle = document.querySelector("#form-title");
    const formCopy = document.querySelector("#form-copy");
    const submitButton = document.querySelector("#submit-button");
    const switchCopy = document.querySelector("#switch-copy");
    const switchButton = document.querySelector("#switch-button");
    const message = document.querySelector("#message");
    const userGreeting = document.querySelector("#user-greeting");
    const itemList = document.querySelector("#item-list");
    const urlForm = document.querySelector("#url-form");
    const urlInput = document.querySelector("#url-input");
    const uploadForm = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#file-input");
    const fileTitle = document.querySelector("#file-title");
    const captureMessage = document.querySelector("#capture-message");
    const reviewView = document.querySelector("#review-view");
    const reviewTitle = document.querySelector("#review-title");
    const reviewSource = document.querySelector("#review-source");
    const reviewGenerated = document.querySelector("#review-generated");
    const reviewItemTitle = document.querySelector("#review-item-title");
    const reviewSummary = document.querySelector("#review-summary");
    const reviewTags = document.querySelector("#review-tags");
    const reviewCategory = document.querySelector("#review-category");
    const reviewMarkdown = document.querySelector("#review-markdown");
    const markdownSourceMode = document.querySelector("#markdown-source-mode");
    const markdownPreviewMode = document.querySelector("#markdown-preview-mode");
    const markdownSourcePanel = document.querySelector("#markdown-source-panel");
    const markdownPreviewPanel = document.querySelector("#markdown-preview-panel");
    const reviewMarkdownPreview = document.querySelector("#review-markdown-preview");
    const reviewMessage = document.querySelector("#review-message");
    const reviewSave = document.querySelector("#review-save");
    const reviewApprove = document.querySelector("#review-approve");
    const reviewArchive = document.querySelector("#review-archive");
    const categoryForm = document.querySelector("#category-form");
    const categoryName = document.querySelector("#category-name");
    const categoryPath = document.querySelector("#category-path");
    const categoryParent = document.querySelector("#category-parent");
    const categoryMessage = document.querySelector("#category-message");
    const categoryList = document.querySelector("#category-list");
    let categories = [];
    let selectedItem = null;
    let editingCategoryId = null;
    let categoryPathTouched = false;
    let registering = false;

    function renderMarkdown(markdown) {
      return DOMPurify.sanitize(marked.parse(markdown, { gfm: true }));
    }

    function setMarkdownMode(preview) {
      markdownSourcePanel.hidden = preview;
      markdownPreviewPanel.hidden = !preview;
      markdownSourceMode.setAttribute("aria-pressed", String(!preview));
      markdownPreviewMode.setAttribute("aria-pressed", String(preview));
      if (preview) reviewMarkdownPreview.innerHTML = renderMarkdown(reviewMarkdown.value);
    }

    function setMode(nextRegistering) {
      registering = nextRegistering;
      nameField.hidden = !registering;
      displayName.required = registering;
      formTitle.textContent = registering ? "Create your account" : "Welcome back";
      formCopy.textContent = registering ? "Start with a local curator account." : "Sign in to continue to your inbox.";
      submitButton.textContent = registering ? "Create account" : "Sign in";
      switchCopy.textContent = registering ? "Already have an account?" : "New here?";
      switchButton.textContent = registering ? "Sign in" : "Create an account";
    }

    switchButton.addEventListener("click", () => {
      setMode(!registering);
      message.textContent = "";
    });

    async function loadItems() {
      const response = await fetch("/api/items", { credentials: "same-origin" });
      if (!response.ok) throw new Error("Could not load the inbox");
      const items = await response.json();
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
      itemList.innerHTML = items.length
        ? items.map((item) => `<article class="item"><button type="button" data-item-id="${escapeHtml(item.id)}"><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.status)} · ${escapeHtml(item.source_type)}</p></button></article>`).join("")
        : '<p class="empty">No captures yet.</p>';
    }

    async function loadCategories() {
      const response = await fetch("/api/categories", { credentials: "same-origin" });
      if (!response.ok) throw new Error("Could not load categories");
      categories = await response.json();
      const options = categories.map((category) => {
        const option = document.createElement("option");
        option.value = category.id;
        option.textContent = `${category.path}`;
        return option;
      });
      reviewCategory.replaceChildren(new Option("Uncategorized", ""), ...options);
      categoryParent.replaceChildren(new Option("No parent", ""), ...options.map((option) => option.cloneNode(true)));
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
      categoryList.innerHTML = categories.length
        ? categories.map((category) => `<div class="category-row"><div class="category-label"><strong>${escapeHtml(category.name)}</strong><small>${escapeHtml(category.path)}</small></div><span class="category-actions"><button type="button" data-edit-category="${category.id}">Edit</button><button type="button" data-delete-category="${category.id}">Delete</button></span></div>`).join("")
        : '<p class="empty">No categories yet.</p>';
    }

    async function openReview(itemId) {
      const response = await fetch(`/api/items/${encodeURIComponent(itemId)}`, { credentials: "same-origin" });
      if (!response.ok) throw new Error("Could not load the item");
      selectedItem = await response.json();
      reviewTitle.textContent = selectedItem.title;
      reviewSource.textContent = selectedItem.attachments.length
        ? `Source: ${selectedItem.attachments.map((attachment) => attachment.filename).join(", ")}`
        : `Source: ${selectedItem.source_ref || selectedItem.source_type}`;
      reviewGenerated.textContent = selectedItem.markdown_generated || "No generated Markdown available.";
      reviewItemTitle.value = selectedItem.title;
      reviewSummary.value = selectedItem.summary || "";
      reviewTags.value = (selectedItem.tags || []).join(", ");
      reviewCategory.value = selectedItem.category_id || "";
      reviewMarkdown.value = selectedItem.markdown_final || selectedItem.markdown_generated || "";
      setMarkdownMode(false);
      reviewSave.hidden = ["approved", "archived"].includes(selectedItem.status);
      reviewApprove.hidden = selectedItem.status !== "review";
      reviewArchive.hidden = !["inbox", "draft", "review", "error"].includes(selectedItem.status);
      reviewMessage.textContent = `Status: ${selectedItem.status}`;
      reviewView.hidden = false;
    }

    itemList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-item-id]");
      if (!button) return;
      openReview(button.dataset.itemId).catch((error) => { captureMessage.textContent = error.message; });
    });

    async function updateSelectedItem(fields) {
      const response = await fetch(`/api/items/${encodeURIComponent(selectedItem.id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(fields)
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || "Could not update the item");
      await openReview(selectedItem.id);
      await loadItems();
    }

    reviewSave.addEventListener("click", async () => {
      if (!selectedItem) return;
      reviewMessage.textContent = "Saving...";
      try {
        const fields = {
          title: reviewItemTitle.value,
          summary: reviewSummary.value,
          tags: reviewTags.value.split(",").map((tag) => tag.trim()).filter(Boolean),
          category_id: reviewCategory.value || null,
          markdown_final: reviewMarkdown.value
        };
        if (selectedItem.status === "draft") fields.status = "review";
        await updateSelectedItem(fields);
        reviewMessage.textContent = "Changes saved.";
      } catch (error) {
        reviewMessage.textContent = error.message;
      }
    });

    reviewApprove.addEventListener("click", async () => {
      if (!selectedItem) return;
      reviewMessage.textContent = "Approving...";
      try {
        await updateSelectedItem({
          title: reviewItemTitle.value,
          summary: reviewSummary.value,
          tags: reviewTags.value.split(",").map((tag) => tag.trim()).filter(Boolean),
          category_id: reviewCategory.value || null,
          markdown_final: reviewMarkdown.value,
          status: "approved"
        });
        reviewMessage.textContent = "Approved for publishing.";
      } catch (error) {
        reviewMessage.textContent = error.message;
      }
    });

    reviewArchive.addEventListener("click", async () => {
      if (!selectedItem) return;
      reviewMessage.textContent = "Archiving...";
      try {
        await updateSelectedItem({ status: "archived" });
        reviewMessage.textContent = "Archived. The capture remains available in Inbox history.";
      } catch (error) {
        reviewMessage.textContent = error.message;
      }
    });

    markdownSourceMode.addEventListener("click", () => setMarkdownMode(false));
    markdownPreviewMode.addEventListener("click", () => setMarkdownMode(true));
    reviewMarkdown.addEventListener("input", () => {
      if (!markdownPreviewPanel.hidden) reviewMarkdownPreview.innerHTML = renderMarkdown(reviewMarkdown.value);
    });

    function showApp(user) {
      document.body.classList.add("workspace-mode");
      authView.hidden = true;
      appView.hidden = false;
      userGreeting.textContent = `Signed in as ${user.display_name}.`;
      loadItems().catch((error) => { captureMessage.textContent = error.message; });
      loadCategories().catch((error) => { categoryMessage.textContent = error.message; });
    }

    categoryForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      categoryMessage.textContent = editingCategoryId ? "Saving..." : "Creating...";
      try {
        const endpoint = editingCategoryId
          ? `/api/categories/${encodeURIComponent(editingCategoryId)}`
          : "/api/categories";
        const response = await fetch(endpoint, {
          method: editingCategoryId ? "PATCH" : "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            name: categoryName.value,
            path: categoryPath.value,
            parent_id: categoryParent.value || null
          })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Could not create category");
        categoryName.value = "";
        categoryPath.value = "";
        categoryParent.value = "";
        editingCategoryId = null;
        categoryPathTouched = false;
        categoryForm.querySelector("button[type=submit]").textContent = "Create category";
        categoryMessage.textContent = "Category saved.";
        await loadCategories();
      } catch (error) {
        categoryMessage.textContent = error.message;
      }
    });

    categoryList.addEventListener("click", async (event) => {
      const editButton = event.target.closest("[data-edit-category]");
      const deleteButton = event.target.closest("[data-delete-category]");
      if (editButton) {
        const category = categories.find((entry) => entry.id === editButton.dataset.editCategory);
        if (!category) return;
        editingCategoryId = category.id;
        categoryPathTouched = true;
        categoryName.value = category.name;
        categoryPath.value = category.slug || category.path.split("/").pop();
        categoryParent.value = category.parent_id || "";
        categoryForm.querySelector("button[type=submit]").textContent = "Save category";
        return;
      }
      if (deleteButton) {
        const response = await fetch(
          `/api/categories/${encodeURIComponent(deleteButton.dataset.deleteCategory)}`,
          { method: "DELETE", credentials: "same-origin" },
        );
        const body = response.status === 204 ? {} : await response.json();
        categoryMessage.textContent = response.ok
          ? "Category deleted."
          : (body.detail || "Could not delete category");
        if (response.ok) await loadCategories();
      }
    });

    categoryName.addEventListener("input", () => {
      if (editingCategoryId || categoryPathTouched) return;
      categoryPath.value = categoryName.value
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    });

    categoryPath.addEventListener("input", () => {
      categoryPathTouched = true;
    });

    document.querySelector("#logout-button").addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" });
      appView.hidden = true;
      authView.hidden = false;
      document.body.classList.remove("workspace-mode");
      reviewView.hidden = true;
      selectedItem = null;
      message.textContent = "Signed out.";
    });

    urlForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      captureMessage.textContent = "Fetching page...";
      const url = encodeURIComponent(urlInput.value);
      try {
        const response = await fetch(`/api/items/url?url=${url}`, {
          method: "POST", credentials: "same-origin"
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Could not capture URL");
        urlInput.value = "";
        captureMessage.textContent = "Added to inbox.";
        await loadItems();
      } catch (error) {
        captureMessage.textContent = error.message;
      }
    });

    uploadForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;
      captureMessage.textContent = "Uploading and converting...";
      try {
        const formData = new FormData();
        formData.append("file", file);
        if (fileTitle.value.trim()) formData.append("title", fileTitle.value);
        const uploadResponse = await fetch("/api/items/upload", {
          method: "POST", credentials: "same-origin", body: formData
        });
        const uploadBody = await uploadResponse.json();
        if (!uploadResponse.ok) throw new Error(uploadBody.detail || "Could not upload file");
        const convertResponse = await fetch(`/api/items/${encodeURIComponent(uploadBody.id)}/convert`, {
          method: "POST", credentials: "same-origin"
        });
        const convertBody = await convertResponse.json();
        if (!convertResponse.ok) throw new Error(convertBody.detail || "Could not convert file");
        fileInput.value = "";
        fileTitle.value = "";
        captureMessage.textContent = "Uploaded and converted. Added to inbox.";
        await loadItems();
      } catch (error) {
        captureMessage.textContent = error.message;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Working...";
      const payload = { email: form.email.value, password: form.password.value };
      if (registering) payload.display_name = form.display_name.value;
      const endpoint = registering ? "/api/auth/register" : "/api/auth/login";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(payload)
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Authentication failed");
        const successMessage = registering
          ? `Account created. Signed in as ${body.display_name}.`
          : `Signed in as ${body.display_name}.`;
        message.textContent = successMessage;
        showApp(body);
        if (registering) {
          setMode(false);
          displayName.value = "";
        }
      } catch (error) {
        message.textContent = error.message;
      }
    });

    fetch("/api/auth/me", { credentials: "same-origin" })
      .then((response) => response.ok ? response.json() : null)
      .then((user) => { if (user) showApp(user); });
  </script>
</body>
</html>

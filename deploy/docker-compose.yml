name: wiki-wrangler

services:
  web:
    image: wiki-wrangler-web:latest
    build:
      context: ../web
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    image: wiki-wrangler-api:latest
    build:
      context: ../backend
    ports:
      - "8000:8000"
    volumes:
      - wiki-wrangler-data:/data

volumes:
  wiki-wrangler-data:
    name: wiki-wrangler-data
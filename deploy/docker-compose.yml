name: wiki-wrangler

services:
  web:
    image: wiki-wrangler-web:latest
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    image: wiki-wrangler-api:latest
    build:
      context: ../backend
    ports:
      - "8000:8000"
    environment:
      WIKI_WRANGLER_STORAGE_PATH: /data/storage
      WIKI_WRANGLER_PUBLISH_WORKSPACE: /data/publish-workspaces
      WIKI_WRANGLER_GIT_AUTHOR_NAME: ${WIKI_WRANGLER_GIT_AUTHOR_NAME:-Wiki Wrangler}
      WIKI_WRANGLER_GIT_AUTHOR_EMAIL: ${WIKI_WRANGLER_GIT_AUTHOR_EMAIL:-wiki-wrangler@localhost}
    volumes:
      - wiki-wrangler-data:/data

  worker:
    image: wiki-wrangler-api:latest
    build:
      context: ../backend
    command: ["python", "-m", "app.worker"]
    environment:
      WIKI_WRANGLER_STORAGE_PATH: /data/storage
      WIKI_WRANGLER_PUBLISH_WORKSPACE: /data/publish-workspaces
      WIKI_WRANGLER_GIT_AUTHOR_NAME: ${WIKI_WRANGLER_GIT_AUTHOR_NAME:-Wiki Wrangler}
      WIKI_WRANGLER_GIT_AUTHOR_EMAIL: ${WIKI_WRANGLER_GIT_AUTHOR_EMAIL:-wiki-wrangler@localhost}
    volumes:
      - wiki-wrangler-data:/data
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

volumes:
  wiki-wrangler-data:
    name: wiki-wrangler-data
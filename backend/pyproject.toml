[project]
name = "wiki-wrangler-backend"
version = "0.1.0"
description = "API for staging, curating, and publishing knowledge to a Git-based wiki."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]